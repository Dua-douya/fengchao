<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>蜂巢 Honeycomb Global Store · 邀请海报</title>
<style>
  /* ===== 品牌色（来自官方色彩规范 CMYK 5-25-85-0 / 5-18-85-0 / 5-35-85-0）===== */
  :root{
    --brand:#F2C72D;        /* 主色 */
    --brand-lt:#F6D12B;     /* 浅 */
    --brand-dk:#F1B62E;     /* 深 */
    --ink:#141414;          /* 字标黑 */
    --white:#fff;
    --gray-50:#f4f5f6;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
    background:var(--gray-50);color:var(--ink);
    padding-bottom:calc(112px + var(--safe-b));
  }
  .wrap{max-width:430px;margin:0 auto;min-height:100vh;background:var(--gray-50);position:relative}

  .topbar{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;
    padding:13px 18px 12px;background:rgba(255,255,255,.95);
    backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);
    border-bottom:1px solid #ececec;
  }
  .topbar img{display:block;height:34px;width:auto}

  .stage{padding:16px 16px 0}
  .poster-wrap{
    border-radius:22px;overflow:hidden;background:#101010;
    box-shadow:0 20px 46px -18px rgba(0,0,0,.42), 0 2px 8px rgba(0,0,0,.12);
  }
  #poster{display:block;width:100%;height:auto}
  /* 复制按钮：覆盖在画布内邀请码卡的右侧留白处（坐标为画布相对值） */
  .poster-wrap .cr-copy{
    position:absolute;left:67.29%;top:43.1%;width:20.44%;height:3.53%;
    display:flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:999px;background:var(--ink);color:#fff;
    font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;
  }
  .poster-wrap .cr-copy:active{opacity:.82}
  .poster-wrap .cr-copy svg{width:13px;height:13px;display:block;flex:none}
  .hint{text-align:center;font-size:11px;color:#9a9a9a;margin:14px 2px 0;line-height:1.7}

  .bbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px 16px calc(12px + var(--safe-b));
    background:linear-gradient(180deg,rgba(244,245,246,0),rgba(244,245,246,.96) 34%,#f4f5f6);
  }
  .bbar .inner{max-width:430px;margin:0 auto}
  .btn{
    width:100%;height:52px;border:none;border-radius:14px;font-family:inherit;
    font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(.985);opacity:.9}
  .btn-brand{background:var(--brand);color:var(--ink);box-shadow:0 8px 20px -10px rgba(242,199,45,.95)}
  .btn svg{width:18px;height:18px;display:block}

  .toast{
    position:fixed;left:50%;bottom:calc(140px + var(--safe-b));transform:translate(-50%,10px);
    background:rgba(20,20,20,.94);color:#fff;font-size:12.5px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar"><img id="tb-logo" alt="蜂巢 Honeycomb Global Store"></header>

  <div class="stage">
    <div class="poster-wrap" onclick="downloadPoster()" title="长按或点击保存海报">
      <canvas id="poster" width="1125" height="2436" aria-label="蜂巢邀请海报"></canvas>
      <button class="cr-copy" onclick="event.stopPropagation();copyCode()" aria-label="复制邀请码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>复制</span>
      </button>
    </div>
    <div class="hint">长按海报可保存到相册，发给好友即可邀请</div>
  </div>

  <div class="bbar">
    <div class="inner">
      <button class="btn btn-brand" id="dl-btn" onclick="openAppOrStore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        下载 App
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

/* ---------- 链接参数 ---------- */
var Q = (function(){
  var o = {}, qs = (location.search || '').replace(/^\?/, '').split('&');
  for (var i = 0; i < qs.length; i++) {
    if (!qs[i]) continue;
    var kv = qs[i].split('=');
    o[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  }
  return o;
})();

var CODE = Q.code || 'FC-8K2Q';
/* bare=1：纯品牌海报（供 App 内分享用）——去掉全部文案，只保留官方 logo 与品牌几何 */
var BARE = Q.bare === '1';

/* ---------- 品牌色 ---------- */
var BRAND = '#F2C72D', BRAND_LT = '#F6D12B', BRAND_DK = '#F1B62E';
var INK = '#141414', DARK = '#101010';

/* ---------- 画布 ---------- */
var W = 1125, H = 2436;          /* 375 × 812 @3x —— 与 App 全屏一致 */
var M = 90, CW = W - M * 2;
var ZONE = 1560;                 /* 金色区高度，其余为深色区 */

var cv = document.getElementById('poster');
var g = (cv && cv.getContext) ? cv.getContext('2d') : null;

/* ---------- 绘制工具 ---------- */
function rr(x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}
function fillRR(x, y, w, h, r, fill){ rr(x, y, w, h, r); g.fillStyle = fill; g.fill(); }
function txt(s, x, y, font, color, align){
  g.font = font; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic';
  g.fillText(s, x, y);
}
function spaced(s, x, y, font, color, gap){
  g.font = font; g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  var cx = x;
  for (var i = 0; i < s.length; i++){ g.fillText(s[i], cx, y); cx += g.measureText(s[i]).width + gap; }
  return cx - x - gap;
}
function tw(s, font){ g.font = font; return g.measureText(s).width; }

/* ---------- 品牌蜂窝纹（平顶六边形，与官方底纹一致） ---------- */
function hexPath(cx, cy, R){
  var h = Math.sqrt(3) * R;
  g.beginPath();
  g.moveTo(cx + R, cy);
  g.lineTo(cx + R / 2, cy + h / 2);
  g.lineTo(cx - R / 2, cy + h / 2);
  g.lineTo(cx - R, cy);
  g.lineTo(cx - R / 2, cy - h / 2);
  g.lineTo(cx + R / 2, cy - h / 2);
  g.closePath();
}
function hexGrid(yTop, yBot, R, color, alpha, lw){
  g.save();
  g.beginPath(); g.rect(0, yTop, W, yBot - yTop); g.clip();
  g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = lw; g.lineJoin = 'round';
  var h = Math.sqrt(3) * R;
  var cols = Math.ceil(W / (1.5 * R)) + 2;
  var rows = Math.ceil((yBot - yTop) / h) + 2;
  for (var c = 0; c < cols; c++){
    var cx = c * 1.5 * R - R;
    var off = (c % 2) ? h / 2 : 0;
    for (var r = -1; r < rows; r++){
      var cy = yTop + r * h + off;
      hexPath(cx, cy, R);
      g.stroke();
    }
  }
  g.restore();
}
/* 蜂窝花格：1 个中心格 + 6 个邻格（品牌几何，用作纯海报的主视觉） */
function hexRosette(cx, cy, R, color, aCenter, aAround, lwCenter, lwAround){
  var h = Math.sqrt(3) * R;
  g.save(); g.strokeStyle = color; g.lineJoin = 'round';
  var nb = [[1.5 * R, -h / 2], [1.5 * R, h / 2], [0, h], [-1.5 * R, h / 2], [-1.5 * R, -h / 2], [0, -h]];
  g.globalAlpha = aAround; g.lineWidth = lwAround;
  for (var i = 0; i < nb.length; i++){ hexPath(cx + nb[i][0], cy + nb[i][1], R); g.stroke(); }
  g.globalAlpha = aCenter; g.lineWidth = lwCenter;
  hexPath(cx, cy, R); g.stroke();
  g.restore();
}
function glow(cx, cy, r, color){
  var gr = g.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(cx - r, cy - r, r * 2, r * 2);
}

/* ---------- 官方锁排：单色着色 ---------- */
var lockup = new Image();
var lockReady = false;
if (LOCKUP_WHITE && LOCKUP_WHITE.indexOf('data:') === 0){
  lockup.onload = function(){ lockReady = true; draw(); };
  lockup.src = LOCKUP_WHITE;
}
function tinted(img, color){
  var c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  var x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  return c;
}
function drawLockup(x, y, w, color, alpha){
  if (!lockReady || !lockup.naturalWidth) return;
  var src = tinted(lockup, color);
  var h = w * lockup.naturalHeight / lockup.naturalWidth;
  g.save(); g.globalAlpha = alpha == null ? 1 : alpha;
  g.drawImage(src, x, y, w, h);
  g.restore();
  return h;
}


/* ---------- 绘制整张海报 ---------- */
function draw(){
  if (!g) return;

  /* ============ 金色区（品牌主色 #F2C72D） ============ */
  var goldGrad = g.createLinearGradient(0, 0, W * .55, ZONE);
  goldGrad.addColorStop(0, BRAND_LT);
  goldGrad.addColorStop(.5, BRAND);
  goldGrad.addColorStop(1, BRAND_DK);
  g.fillStyle = goldGrad; g.fillRect(0, 0, W, ZONE);

  /* 官方蜂窝底纹 */
  hexGrid(0, ZONE, 56, '#ffffff', .24, 3);
  glow(200, 240, 560, 'rgba(255,255,255,.28)');

  /* 品牌六边形（官方标记的核心几何），右侧出血 */
  g.save();
  g.globalAlpha = .26; g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.lineJoin = 'round';
  hexPath(1006, 1096, 352); g.stroke();
  g.globalAlpha = .16; g.lineWidth = 6;
  hexPath(1006, 1096, 256); g.stroke();
  g.restore();

  /* 官方品牌锁排（单色黑，金色底上的标准用法） */
  drawLockup(M, 112, 460, INK, 1);

  if (BARE) {
  /* 纯品牌海报：不排任何文案，用品牌蜂窝花格作主视觉 */
  hexRosette(562, 930, 208, '#ffffff', .34, .17, 12, 8);
  glow(562, 930, 660, 'rgba(255,255,255,.18)');
  } else {
  /* 限时邀请 */
  var pillF = '700 26px ' + FONT;
  var pillW = tw('限时邀请', pillF) + 56;
  fillRR(M, 404, pillW, 66, 33, INK);
  txt('限时邀请', M + 28, 404 + 44, pillF, BRAND);

  /* 主标题 */
  txt('好友邀你加入', M, 584, '800 94px ' + FONT, INK);
  txt('蜂巢后付套餐', M, 700, '800 94px ' + FONT, INK);
  fillRR(M, 740, 152, 10, 5, INK);

  /* 副标题 */
  txt('零月租压力 · 先办套餐后付月费 · 办理即返话费', M, 816, '400 29px ' + FONT, 'rgba(20,20,20,.66)');

  /* 邀请码主卡（海报视觉重点） */
  var cy = 880, ch = 470;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.18)'; g.shadowBlur = 40; g.shadowOffsetY = 14;
  fillRR(M, cy, CW, ch, 34, '#ffffff');
  g.restore();
  txt('好友邀请码', M + 48, cy + 96, '600 28px ' + FONT, 'rgba(20,20,20,.5)');
  txt(CODE, M + 48, cy + 250, '800 104px ' + FONT, INK);
  g.strokeStyle = 'rgba(20,20,20,.12)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(M + 48, cy + 312); g.lineTo(W - M - 48, cy + 312); g.stroke();
  txt('打开蜂巢 App 输入邀请码 · 双方各得 1 个月话费返现', M + 48, cy + 396, '400 26px ' + FONT, 'rgba(20,20,20,.55)');

  }

  /* ============ 深色区（字标黑） ============ */
  g.fillStyle = DARK; g.fillRect(0, ZONE, W, H - ZONE);
  hexGrid(ZONE, H, 56, BRAND, .14, 3);
  glow(W - 180, H - 300, 520, 'rgba(242,199,45,.10)');

  if (BARE) {
  /* 纯品牌海报：不排任何文案，蜂窝花格 + 页脚官方 logo */
  hexRosette(562, 1856, 132, BRAND, .34, .17, 9, 6);
  glow(W - 200, H - 360, 560, 'rgba(242,199,45,.10)');
  drawLockup(M, 2196, 250, '#ffffff', .92);
  } else {
  /* 如何领取（三步） */
  txt('如何领取', M, 1720, '800 58px ' + FONT, '#ffffff');
  var steps = [
    ['1', '下载蜂巢 App', 'App Store / Google Play 搜索「蜂巢」'],
    ['2', '注册时填入邀请码', CODE + ' · 一人仅可绑定一个邀请人'],
    ['3', '办理后付套餐', '开通成功即返现，双方各得 1 个月话费']
  ];
  for (var i = 0; i < steps.length; i++){
    var sy = 1832 + i * 112;
    g.fillStyle = BRAND; g.beginPath(); g.arc(M + 34, sy - 11, 33, 0, Math.PI * 2); g.fill();
    txt(steps[i][0], M + 34, sy, '800 34px ' + FONT, INK, 'center');
    txt(steps[i][1], M + 96, sy, '700 33px ' + FONT, '#ffffff');
    txt(steps[i][2], M + 96, sy + 44, '400 25px ' + FONT, 'rgba(255,255,255,.55)');
  }

  /* 页脚 */
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(M, 2156); g.lineTo(W - M, 2156); g.stroke();
  drawLockup(M, 2196, 250, '#ffffff', .92);
  txt('蜂巢 · 韩国通信服务', W - M, 2272, '400 23px ' + FONT, 'rgba(255,255,255,.38)', 'right');
  }
}

/* ---------- 复制邀请码 ---------- */
function copyCode(){
  var t = CODE;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(
        function(){ toast('邀请码已复制：' + t); },
        function(){ toast('邀请码：' + t); }
      );
      return;
    }
  } catch (e) {}
  toast('邀请码：' + t);
}
/* ---------- 下载 App ---------- */
function openAppOrStore(){
  toast('正在前往 App Store / Google Play');
  try { window.location.href = 'beehive://open?code=' + encodeURIComponent(CODE); } catch (e) {}
}

/* ---------- 保存海报（点击 / 长按） ---------- */
function downloadPoster(){
  try {
    if (!cv || !cv.toBlob){ toast('当前浏览器不支持直接下载，请长按海报保存'); return; }
    cv.toBlob(function(blob){
      if (!blob){ toast('生成失败，请长按海报保存'); return; }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '蜂巢邀请海报-' + CODE + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1200);
      toast('海报已开始下载');
    }, 'image/png');
  } catch (e) {
    toast('生成失败，请长按海报保存');
  }
}

/* ---------- 轻提示 ---------- */
var _tt = null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.classList.remove('show'); }, 1900);
}

/* ---------- 启动 ---------- */
var tb = document.getElementById('tb-logo');
if (tb) tb.src = LOCKUP_COLOR;
var pc = document.getElementById('pg-code');
if (pc) pc.textContent = CODE;
if (BARE){
  /* 纯海报：隐藏复制键 / 提示 / 底部操作栏，页面上只有一张海报 */
  ['.cr-copy', '.hint', '.bbar'].forEach(function(sel){
    document.querySelectorAll(sel).forEach(function(el){ el.style.display = 'none'; });
  });
  document.title = '蜂巢 · 品牌海报';
}
draw();
</script>
